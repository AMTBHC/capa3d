# Catálogo y precios de Capa3D. Esta es la fuente de verdad del precio:
# la web lo lee de GET /api/catalog para su estimado inmediato.

currency = "COP"

[pricing]
# Tarifa de máquina por hora de impresión.
machine_rate_per_hour = 2500
# Cargo fijo por copia del proyecto (preparación, revisión, retiro de cama).
base_fee = 5000
# El precio por unidad se redondea a este múltiplo.
round_to = 100
# Calentamiento y preparación de cada cama, en horas.
setup_hours_per_plate = 0.2
# Días que se respeta una cotización.
quote_valid_days = 7

[printer]
# Elige tu impresora: cama en mm (X, Y, Z) y perfil de config/profiles/.
#   Bambu X1C / X1E / P1S / P1P → bed = [256, 256, 256], profile = "profiles/bambu-x1-p1.ini"
#   Bambu A1                    → bed = [256, 256, 256], profile = "profiles/bambu-a1.ini"
#   Bambu A1 mini               → bed = [180, 180, 180], profile = "profiles/bambu-a1.ini"
#   Otra (tipo Prusa / Ender)   → tu cama,               profile = "profiles/generico.ini"
bed = [256, 256, 256]
profile = "profiles/bambu-a1.ini"

[calibration]
# Corrigen la diferencia entre el laminado de la API (PrusaSlicer) y tu Bambu Studio.
# Calcúlalos con: python -m capa3d_api.calibrate (ver README). 1 = sin corrección.
time_factor = 1.0
weight_factor = 1.0

[multicolor]
# Piezas de varios colores (AMS): cada cambio de filamento purga material y toma tiempo.
# Los cambios se cuentan con el modelo: en cada capa, (colores en esa capa − 1).
# Purga por cambio en mm³ cuando el archivo no trae la suya (Bambu guarda su matriz de purga).
purge_mm3 = 350
# Segundos por cambio en la A1 con AMS lite (cortar, cambiar, purgar).
change_seconds = 40
# Colores que carga tu AMS a la vez; con más, la cotización avisa que hay que confirmarlo.
max_colors = 4

[limits]
# Archivos más grandes que esto no reciben precio en línea: el sitio muestra un aviso y el
# cliente lo cotiza por WhatsApp. El archivo igual queda en el panel para descargarlo.
max_plates = 8
max_file_mb = 50
# Horas de impresión estimadas de una copia, con el material, calidad y relleno elegidos.
max_print_hours = 24

[shipping]
# Envío a domicilio en COP. Lo puedes ajustar en cada pedido antes de confirmarlo.
cost = 15000

[shipping.cities]
# Ciudades con otra tarifa, por ejemplo la del taller (sin importar tildes ni mayúsculas).
# "Medellín" = 8000

[payments]
# El cliente puede pagar el 100 % en línea, o abonar este porcentaje en línea y pagar
# el resto en efectivo al recibir. 0 = solo pago total.
deposit_percent = 50

# price_per_gram en COP. density en g/cm³. Temperaturas en °C.
# max_volumetric_speed (mm³/s) y min_layer_time (s) como en los perfiles de filamento
# genéricos de Bambu Studio: limitan la velocidad real y por eso pesan en el tiempo.
[materials.PLA]
max_volumetric_speed = 21
min_layer_time = 4
price_per_gram = 120
density = 1.24
temperature = 215
bed_temperature = 60

[materials.PETG]
max_volumetric_speed = 13
min_layer_time = 8
price_per_gram = 140
density = 1.27
temperature = 240
bed_temperature = 80

[materials.ABS]
max_volumetric_speed = 16
min_layer_time = 3
price_per_gram = 140
density = 1.04
temperature = 250
bed_temperature = 100

[materials.TPU]
max_volumetric_speed = 3.6
min_layer_time = 8
price_per_gram = 250
density = 1.21
temperature = 225
bed_temperature = 50

# flow: mm³/s efectivos, solo para el estimado cuando no se puede laminar.
[qualities.borrador]
layer_height = 0.28
flow = 12

[qualities.estandar]
layer_height = 0.20
flow = 8

[qualities.detalle]
layer_height = 0.12
flow = 4.5
