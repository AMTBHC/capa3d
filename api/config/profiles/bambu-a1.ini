# Bambu Lab A1 y A1 mini: velocidades de "0.20mm Standard @BBL A1" en Bambu Studio,
# traducidas a PrusaSlicer. La API sobrescribe cama, capa, relleno,
# soportes, temperaturas, densidad, caudal máximo y tiempo mínimo de capa del material.
# Después de cambiarlo, calibra con: python -m capa3d_api.calibrate (ver README).

gcode_flavor = marlin2
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1

perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_pattern = grid
first_layer_height = 0.2
skirts = 0
brim_width = 0

external_perimeter_speed = 200
perimeter_speed = 300
small_perimeter_speed = 50%
infill_speed = 270
solid_infill_speed = 250
top_solid_infill_speed = 200
gap_fill_speed = 250
support_material_speed = 150
support_material_interface_speed = 80
bridge_speed = 50
travel_speed = 500
travel_speed_z = 20
first_layer_speed = 50
max_print_speed = 500
enable_dynamic_overhang_speeds = 0

default_acceleration = 10000
external_perimeter_acceleration = 5000
perimeter_acceleration = 10000
infill_acceleration = 10000
solid_infill_acceleration = 10000
top_solid_infill_acceleration = 2000
bridge_acceleration = 5000
first_layer_acceleration = 500
travel_acceleration = 10000

machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 12000,12000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 12000,12000
machine_max_acceleration_x = 12000,12000
machine_max_acceleration_y = 12000,12000
machine_max_acceleration_z = 500,500
machine_max_feedrate_x = 500,500
machine_max_feedrate_y = 500,500
machine_max_feedrate_z = 30,30
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
machine_max_jerk_z = 3,3

support_material_threshold = 30
support_material_contact_distance = 0.2
min_print_speed = 20

# G-code en texto: la API lee el tiempo y el filamento del final del archivo.
binary_gcode = 0
