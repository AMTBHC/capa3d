# Perfil genérico (impresora tipo Prusa/Ender, velocidades moderadas).
# Para otra impresora, exporta su perfil desde PrusaSlicer (Archivo → Exportar → Exportar configuración)
# La API sobrescribe: cama, altura de capa, relleno, soportes, densidad y temperaturas.

gcode_flavor = marlin2
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1

perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_pattern = grid
first_layer_height = 0.2
skirts = 1
brim_width = 0

perimeter_speed = 45
external_perimeter_speed = 30
infill_speed = 80
solid_infill_speed = 60
top_solid_infill_speed = 40
support_material_speed = 50
bridge_speed = 30
gap_fill_speed = 30
travel_speed = 150
first_layer_speed = 25

support_material_threshold = 45
support_material_contact_distance = 0.2

machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 1000,1000
machine_max_acceleration_travel = 1500,1500
machine_max_acceleration_x = 1000,1000
machine_max_acceleration_y = 1000,1000
machine_max_feedrate_x = 200,200
machine_max_feedrate_y = 200,200
machine_max_feedrate_z = 12,12
machine_max_jerk_x = 8,8
machine_max_jerk_y = 8,8

# G-code en texto: la API lee el tiempo y el filamento del final del archivo.
binary_gcode = 0
