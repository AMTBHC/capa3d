name: api

on:
  push:
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PrusaSlicer y OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends prusa-slicer openscad fonts-liberation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
